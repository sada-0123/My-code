<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aman Sales</title>
<style>
:root{--bg:#fff;--surface:#fff;--soft:#f4f5f4;--ink:#111;--muted:#666;--line:#e4e4e4;--accent:#157347;--accent-ink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--surface:#1b1b1b;--soft:#242424;--ink:#f2f2f2;--muted:#a0a0a0;--line:#333;--accent:#3fb97a;--accent-ink:#0b1f15}}
:root[data-theme="dark"]{--bg:#121212;--surface:#1b1b1b;--soft:#242424;--ink:#f2f2f2;--muted:#a0a0a0;--line:#333;--accent:#3fb97a;--accent-ink:#0b1f15}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{margin:0;line-height:1.15}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.logo{font-size:22px;font-weight:700}
.cartbtn,.add{border:0;border-radius:99px;font-weight:700;letter-spacing:.01em;box-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(21,115,71,.28);transition:transform .15s,background .15s,box-shadow .15s}
.cartbtn{background:var(--accent);color:var(--accent-ink);padding:10px 20px}
.cartbtn:hover,.add:hover{transform:translateY(-2px);box-shadow:0 4px 0 rgba(0,0,0,.25),0 10px 18px rgba(21,115,71,.35)}
.kick,.kick:hover{background:#e8590c!important;color:#fff!important;box-shadow:0 2px 0 rgba(0,0,0,.25),0 8px 18px rgba(232,89,12,.4)!important}
.hero{padding:56px 0 40px}
.hero h1{font-size:clamp(34px,6vw,56px);font-weight:700;max-width:16ch}
.hero p{max-width:46ch;color:var(--muted);font-size:18px;margin:14px 0 22px}
.cta{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:13px 22px;font-weight:600;text-decoration:none;display:inline-block}
h2{font-size:28px;margin:8px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.img{aspect-ratio:4/3;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1}
.card h3{font-size:18px}
.card p{color:var(--muted);font-size:14px;margin:6px 0 14px;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{font-weight:600}.price small{color:var(--muted);font-weight:400}
.add{background:var(--accent);color:var(--accent-ink);padding:10px 20px;min-width:92px}
footer{color:var(--muted);font-size:14px;padding:36px 0 28px;border-top:1px solid var(--line);margin-top:40px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(18px + env(safe-area-inset-bottom,0px))}
aside.on{transform:none}
aside header{padding:0 0 12px}
.items{flex:1;overflow:auto}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:14px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:8px;margin-top:4px}
.qty button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 4px}.bar div{height:100%;background:var(--accent);width:0;transition:width .25s}
.total{display:flex;justify-content:space-between;font-weight:600;font-size:18px;margin:12px 0}
.empty{color:var(--muted);padding:24px 0}
.x{background:none;border:0;color:var(--ink);font-size:22px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;text-align:center;max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
.cta{border-radius:99px;font-weight:700}
.cartbtn.back{background:var(--ink);color:var(--bg);box-shadow:none}
.cp-title{display:flex;align-items:baseline;gap:12px;margin:28px 0 20px}
.cp-title h1{font-size:clamp(28px,5vw,40px)}
.cp-title span{color:var(--muted)}
.cp{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
.lines{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 20px}
.line{display:grid;grid-template-columns:84px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.thumb{width:84px;height:84px;border-radius:12px;background:var(--soft);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-align:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.line h3{font-size:17px}
.meta{color:var(--muted);font-size:14px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;margin-top:8px}
.stepper button{width:34px;height:34px;border:0;background:none;color:var(--ink);font-size:18px;border-radius:99px}
.stepper button:hover{background:var(--soft)}
.stepper span{min-width:28px;text-align:center;font-weight:600}
.lp{text-align:right}.lp strong{font-size:17px;display:block}
.rm{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:6px 0}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;position:sticky;top:16px}
.sum h2{font-size:20px;margin:0 0 14px}
.sl{display:flex;justify-content:space-between;margin:8px 0;color:var(--muted)}
.sl.t{color:var(--ink);font-weight:700;font-size:20px;border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.free{color:var(--accent);font-weight:600}
.big{width:100%;font-size:17px;padding:14px 20px;margin-top:16px;box-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(21,115,71,.28);transition:transform .15s,background .15s}
.state{text-align:center;padding:64px 20px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.state .ic{font-size:48px}
.state h2{margin:12px 0 6px}.state p{color:var(--muted);margin:0 auto 22px;max-width:36ch}
@media(max-width:760px){.cp{grid-template-columns:1fr}.sum{position:static}.line{grid-template-columns:64px 1fr}.thumb{width:64px;height:64px}.lp{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;text-align:left}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

var cart={},LIM=600;
var $=function(i){return document.getElementById(i)};
var inr=function(n){return "₹"+n.toLocaleString("en-IN")};
function pic(p){return p.img?'<img src="'+p.img+'" alt="'+p.n+'">':'Product photo'}
$("grid").innerHTML=P.map(function(p){return '<article class="card"><div class="img">'+pic(p)+'</div><div class="body"><h3>'+p.n+'</h3><p>'+p.d+'</p><div class="row"><span class="price">'+inr(p.p)+' <small>/ '+p.w+'</small></span><button class="add" data-id="'+p.id+'">Add</button></div></div></article>'}).join("");
function kick(b,txt){var w=b.offsetWidth,h=b.offsetHeight;clearTimeout(b._k);if(txt&&b._o===undefined)b._o=b.textContent;b.style.transform='scale('+(w+10)/w+','+(h+10)/h+')';b.classList.add('kick');if(txt)b.textContent=txt;b._k=setTimeout(function(){b.style.transform='';b.classList.remove('kick');if(txt){b.textContent=b._o;b._o=undefined}},700)}
var tt;function toast(m){var t=$("toast");t.textContent=m;t.className="on";clearTimeout(tt);tt=setTimeout(function(){t.className=""},2200)}
var FEE=40,done=false;
function prod(id){return P.filter(function(x){return x.id==id})[0]}
function state(ic,h,p,btn){return '<div class="state"><div class="ic">'+ic+'</div><h2>'+h+'</h2><p>'+p+'</p><button class="cta" data-act="shop">'+btn+'</button></div>'}
function render(){
 var ids=Object.keys(cart),n=0,s=0;
 ids.forEach(function(id){n+=cart[id];s+=cart[id]*prod(id).p});
 $("count").textContent=n;
 $("ccount").textContent=n?n+(n==1?" item":" items"):"";
 var b=$("cart-body");
 if(done){b.innerHTML=state("✅","Order placed","This is a demo, so no payment was taken. Thank you for trying Aman Sales.","Continue shopping");return}
 if(!n){b.innerHTML=state("🛒","Your cart is empty","Add a few products and they will show up here.","Browse products");return}
 var lines=ids.map(function(id){var p=prod(id),q=cart[id];
  return '<div class="line"><div class="thumb">'+(p.img?'<img src="'+p.img+'" alt="'+p.n+'">':'No photo')+'</div><div><h3>'+p.n+'</h3><div class="meta">'+p.w+' · '+inr(p.p)+' each</div><div class="stepper"><button data-d="-1" data-id="'+id+'" aria-label="Remove one">−</button><span>'+q+'</span><button data-d="1" data-id="'+id+'" aria-label="Add one">+</button></div></div><div class="lp"><strong>'+inr(q*p.p)+'</strong><button class="rm" data-rm="'+id+'">Remove</button></div></div>'}).join("");
 var fr=s>=LIM,tot=s+(fr?0:FEE);
 b.innerHTML='<div class="cp"><div class="lines">'+lines+'</div><div class="sum"><h2>Order summary</h2><div class="sl"><span>Subtotal</span><span>'+inr(s)+'</span></div><div class="sl"><span>Delivery</span>'+(fr?'<span class="free">Free</span>':'<span>'+inr(FEE)+'</span>')+'</div><div class="bar"><div style="width:'+Math.min(100,s/LIM*100)+'%"></div></div><div class="meta">'+(fr?"You have unlocked free delivery.":"Add "+inr(LIM-s)+" more for free delivery.")+'</div><div class="sl t"><span>Total</span><span>'+inr(tot)+'</span></div><button class="cta big" id="checkout">Place order</button></div></div>'}
function show(v){var c=v==="cart";if(!c)done=false;$("shop-view").hidden=c;$("cart-view").hidden=!c;$("open").hidden=c;$("back").hidden=!c;render()}
function go(v){try{location.hash=v==="cart"?"cart":""}catch(e){}show(v);window.scrollTo(0,0)}
document.addEventListener("click",function(e){var t=e.target.closest("button");if(!t)return;
 if(t.classList.contains("add")){var id=t.dataset.id;cart[id]=(cart[id]||0)+1;render();toast("Added to cart");kick(t,"Added ✓")}
 else if(t.dataset.d){var i=t.dataset.id;cart[i]+=+t.dataset.d;if(cart[i]<1)delete cart[i];render()}
 else if(t.dataset.rm){delete cart[t.dataset.rm];render()}
 else if(t.dataset.act==="shop"){go("shop")}
 else if(t.id==="open"){kick(t);setTimeout(function(){go("cart")},180)}
 else if(t.id==="back"){go("shop")}
 else if(t.id==="checkout"){kick(t);setTimeout(function(){done=true;cart={};render();window.scrollTo(0,0);toast("Order placed (demo). No payment was taken.")},450)}});
window.addEventListener("hashchange",function(){show(location.hash==="#cart"?"cart":"shop")});
show(location.hash==="#cart"?"cart":"shop");
</script>
